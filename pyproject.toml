[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/LiuGaoyong/GraphAtoms"
Repository = "https://github.com/LiuGaoyong/GraphAtoms"
Issues = "https://github.com/LiuGaoyong/GraphAtoms/issues/"
[project]
name = "graphatoms"
version = "3.0.0"
readme = "README.md"
description = "The Chemical Core Class for Graph Theory Analysis."
authors = [{ name = "LiuGaoyong", email = "liugaoyong_88@163.com" }]
license-files = ["src/LICENSE"]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = [
    "chemistry",    #
    "graph theory",
    "reaction",
    "event",
    "KMC",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "ase",
    "pymatgen>2023.6",
    "rdkit>=2025",
    "numpy>=2,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.5",
    "array-api-compat>=1.10",
    "array_api-extra>=0.10",
    "pyarrow",
    "pandas",
    "igraph>=0.11",
    "h5py>=3.16",
    "numpydantic",
    "pydantic>=2.10",
    "tomli; python_version < '3.11'",   # use tomllib in python>=3.11
    "tomli-w",                          # TOML writer
    "pyyaml>=6.0",                      # YAML parser
    "hydra-core>=1.1",                # Hydra config parser
    "typing-extensions",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "python-snappy>=0.7.3",           # More Fase Data Compression
    "array-api-strict",
    "pytest>=8.3",
    "pytest-xdist",
    "jupyterlab",
    "chemiscope",
    # "playwright>=1.52", # chemiscope [headless]
    "nglview",
]

# uv config
[tool.uv]
package = true
[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple" # CERNET
# url = "https://mirrors.nju.edu.cn/pypi/web/simple" # NJU
default = true
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://mirrors.nju.edu.cn/pytorch/whl/cpu/"
# explicit = true
# format = "flat"
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu" }]

# pytest config
[tool.pytest.ini_options]
filterwarnings = [
    "error", # All other warnings are transformed into errors.
    # ignore the following warnings that matching a regex
    # example: "ignore:function ham\(\) is deprecated:DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore:unclosed file.*:ResourceWarning",

]
addopts = "--maxfail=1 -rf" # exit after 1 failures, report fail info
testpaths = ["src/tests"]

# ruff config
[tool.ruff]
line-length = 80
indent-width = 4
unsafe-fixes = true
[tool.ruff.lint]
select = ["F", "E", "W", "UP", "TID"]
ignore = ["F722", "D100"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pixi.package]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
graphatoms = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -s -vv"
benchmark = "pytest -s src/tests-benchmark/*.py"

[tool.pixi.dependencies]
python = ">=3.12"
pytest = ">=8"
array-api-compat = ">=1.15.0"
array-api-extra = ">=0.11.0"
array-api-strict = ">=2.5"
ase = ">=3.28.0"
pymatgen = ">=2026.5.4"
rdkit = ">=2025.9.5"
openbabel = ">=3.1.1"
pyarrow = ">=21.0.0"
scikit-learn = ">=1.8.0"
python-igraph = ">=0.11.9"
numpy = ">=2.0.0"
pydantic = ">=2.10.0"
numpydantic = ">=1.8.1"
python-snappy = ">=0.7.3"
h5py = ">=3.16"
tomli-w = ">=1.2.0"
jupyterlab = ">=4.5.8"
joblib = ">=1.1.0"
ovld = ">=0.5.15"
pytest-xdist = ">=3.8.0"
nglview = ">=0.14.0"
ruff = ">=0.11"
chemiscope = ">=0.1.0"
pyyaml = ">=6.0"
hydra-core = ">=1.1"
typing-extensions = ">=4.12.0"