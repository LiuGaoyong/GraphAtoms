defaults:
  - base_config
  - atoms: aseread
  - bonds: raw
  - calculator: nequip
  - _self_



system:
  _target_: graphatoms.system.System.from_ase
  parse_atoms_is_outer_or_not: true
  attach_is_adsorbate: true
  parse_bonds: ${bonds}
  atoms: ${atoms}



outputs: ./zzzz
hydra:
  run:
    dir: ${outputs}
  verbose: false
debug: true
logfile: '-'
